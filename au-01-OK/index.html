<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project AU - Minimal LISP VM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Project AU // Minimal LISP VM</h1>
    </header>

    <div class="main-container">
        <!-- Left Panel: Code & Output -->
        <div class="panel left-panel">
            <div class="toolbar">
                <button onclick="runLisp()">RUN</button>
                <button onclick="stopLoop()" style="background-color: #333c57;">STOP</button>
                <button onclick="clearCanvasBtn()" style="background-color: #566c86;">CLEAR</button>
            </div>
            <textarea id="code-input"></textarea>
            <div id="output" class="output-box">Ready. Click canvas and hit RUN.</div>
        </div>

        <!-- Right Panel: Canvas -->
        <div class="panel right-panel">
            <div class="canvas-wrapper">
                <canvas id="vmCanvas" width="128" height="128" tabindex="0" oncontextmenu="return false;"></canvas>
            </div>
            <div class="canvas-label">Canvas: 128x128px (Click to capture input)</div>
        </div>
    </div>

    <script src="palette.js"></script>
    <script src="script.js"></script>
</body>
</html>
