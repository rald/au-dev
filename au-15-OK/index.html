<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantasya JS AU LISP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="pane">
      <textarea id="codeInput" placeholder="Code Here!">

(load "http://pantasya.mooo.com:14344/au/scripts/sweetie-16.au")

(define hold NIL)
(define x 0)
(define y 0)

(define setup (lambda () (begin
  (cls (sweetie 0))
  (text "draw with mouse" 0 0 (sweetie 12))
)))

(define update (lambda (dt) (begin
  (if (mouse-down? 0)
    (if hold
      (begin
        (line x y (mouse-x) (mouse-y) (sweetie 12))
        (set! x (mouse-x))
        (set! y (mouse-y))
      )
      (begin
        (set! x (mouse-x))
        (set! y (mouse-y))
        (set! hold T)
      )
    )
    (set! hold NIL)
  )
)))

      </textarea>
    </div>

    <div class="canvas-pane">
      <canvas id="displayCanvas" width="128" height="128"></canvas>
    </div>
  </div>

  <div class="controls">
    <button id="runBtn">RUN</button>
  </div>

  <script src="font.js"></script>
  <script src="au.js"></script>
</body>
</html>
